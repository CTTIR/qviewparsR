on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

name: R-CMD-check

permissions:
  contents: read

jobs:
  R-CMD-check:
    timeout-minutes: 30
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,  r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,  r: 'release'}
          - {os: ubuntu-latest,  r: 'oldrel-1'}
          # Declared minimum R: current releases of several suggested packages
          # (ggplot2 via S7, Hmisc) need R >= 4.2, so this job checks the package
          # with its required dependencies only.
          - {os: ubuntu-22.04,   r: '4.1', minimal: true}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      _R_CHECK_FORCE_SUGGESTS_: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: r-lib/actions/setup-pandoc@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          dependencies: ${{ matrix.config.minimal && '"hard"' || '"all"' }}
          extra-packages: ${{ matrix.config.minimal && 'any::rcmdcheck, any::testthat' || 'any::rcmdcheck' }}
          needs: check

      - uses: r-lib/actions/check-r-package@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          upload-snapshots: true
          args: ${{ matrix.config.minimal && 'c("--no-manual", "--ignore-vignettes")' || 'c("--no-manual", "--as-cran")' }}
          build_args: ${{ matrix.config.minimal && 'c("--no-manual", "--no-build-vignettes")' || 'c("--no-manual", "--compact-vignettes=gs+qpdf")' }}
